name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Checkout → Install → Prisma Generate → Lint → TypeCheck → Test → Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "ci-test-auth-secret-key-at-least-32-chars"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma Generate
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: TypeCheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
